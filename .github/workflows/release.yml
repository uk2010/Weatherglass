name: Release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            artifact: amd64
          - runner: ubuntu-26.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-4-dev libadwaita-1-dev libssl-dev desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --locked
      - name: Install RPM packager
        run: cargo install cargo-generate-rpm --locked
      - name: Build packages
        run: |
          packaging/build-deb.sh
          packaging/build-rpm.sh
      - uses: actions/upload-artifact@v4
        with:
          name: weatherglass-${{ matrix.artifact }}
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: packages
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: weatherglass-*
          path: dist
          merge-multiple: true
      - name: Create source archive
        run: git archive --format=tar.gz --prefix=weatherglass-0.0.1/ -o dist/weatherglass-0.0.1-source.tar.gz HEAD
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --title "Weatherglass 0.0.1"
