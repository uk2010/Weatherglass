[package]
name = "weatherglass"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A native Open-Meteo forecast and animated radar app for GNOME"
repository = "https://github.com/uk2010/Weatherglass"
default-run = "weatherglass"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_18"] }
anyhow = "1.0"
async-trait = "0.1"
async-channel = "2.5"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = { version = "0.10", features = ["serde"] }
directories = "6.0"
erased-serde = "0.4"
futures = "0.3"
once_cell = "1.21"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
reverse_geocoder = "4.1"
rusqlite = { version = "0.37", features = ["bundled"] }
secrecy = "0.10"
secret-service = { version = "5.2", features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.21"
tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
tokio-util = "0.7"
tzf-rs = "1.1"
url = "2.5"
uuid = { version = "1.18", features = ["v4", "serde"] }
zbus = { version = "5.19", features = ["tokio"] }

[package.metadata.generate-rpm]
auto-req = "no"
assets = [
  { source = "target/release/weatherglass", dest = "/usr/bin/weatherglass", mode = "755" },
  { source = "data/io.github.weatherglass.Weatherglass.desktop", dest = "/usr/share/applications/io.github.weatherglass.Weatherglass.desktop", mode = "644" },
  { source = "data/io.github.weatherglass.Weatherglass.metainfo.xml", dest = "/usr/share/metainfo/io.github.weatherglass.Weatherglass.metainfo.xml", mode = "644" },
  { source = "data/icons/hicolor/48x48/apps/io.github.weatherglass.Weatherglass.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.github.weatherglass.Weatherglass.png", mode = "644" },
  { source = "data/icons/hicolor/64x64/apps/io.github.weatherglass.Weatherglass.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.github.weatherglass.Weatherglass.png", mode = "644" },
  { source = "data/icons/hicolor/128x128/apps/io.github.weatherglass.Weatherglass.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.weatherglass.Weatherglass.png", mode = "644" },
  { source = "data/icons/hicolor/256x256/apps/io.github.weatherglass.Weatherglass.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.weatherglass.Weatherglass.png", mode = "644" },
  { source = "data/icons/hicolor/1024x1024/apps/io.github.weatherglass.Weatherglass.png", dest = "/usr/share/icons/hicolor/1024x1024/apps/io.github.weatherglass.Weatherglass.png", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/weatherglass/README.md", mode = "644", doc = true },
  { source = "docs/SECURITY.md", dest = "/usr/share/doc/weatherglass/SECURITY.md", mode = "644", doc = true },
  { source = "docs/THIRD_PARTY.md", dest = "/usr/share/doc/weatherglass/THIRD_PARTY.md", mode = "644", doc = true },
]

[package.metadata.generate-rpm.requires]
gtk4 = ">= 4.18"
libadwaita = ">= 1.6"
ca-certificates = "*"

[dev-dependencies]
httpmock = "0.8"

[profile.release]
lto = "thin"
strip = true
